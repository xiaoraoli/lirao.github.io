<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提案 · AIGC 包材平台</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* 状态筛选 chips */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .fchip{padding:7px 15px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
    font-size:13px;color:var(--text-sub);cursor:pointer;transition:.15s;font-weight:600;}
  .fchip:hover{border-color:var(--border-strong);color:var(--text);}
  .fchip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  .tbl-meta{display:flex;flex-direction:column;gap:1px;}
  .tbl-meta b{font-size:13.5px;}
  .tbl-meta .cust{font-size:12px;color:var(--text-sub);}
  .mono-price{font-family:var(--font-mono);font-size:13px;color:var(--primary);font-weight:600;}
  .row-ops{display:flex;gap:6px;flex-wrap:wrap;}
  .r-op{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;
    border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;color:var(--text-sub);}
  .r-op:hover{border-color:var(--primary);color:var(--primary);}
  .r-op.primary{background:var(--primary-tint);border-color:transparent;color:var(--primary);}
  .r-op.primary:hover{background:#efd7ca;}
  .status-badge{display:inline-flex;align-items:center;gap:5px;}
  .status-badge .dot{width:7px;height:7px;border-radius:50%;}

  /* 加载骨架 */
  .skel{background:linear-gradient(90deg,var(--surface2) 25%,#f6f1e8 40%,var(--surface2) 55%);background-size:220% 100%;
    animation:shimmer 1.2s infinite linear;border-radius:var(--radius-sm);}
  @keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

  /* 分享模态 */
  .share-qr{display:flex;flex-direction:column;align-items:center;margin:6px 0 14px;}
  .share-box{display:flex;gap:18px;align-items:center;}
  .share-lr{flex:1;}
  .qr{padding:12px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);
    display:inline-grid;grid-template-columns:repeat(21,1fr);gap:1px;box-shadow:var(--shadow-sm);}
  .qr i{display:block;aspect-ratio:1;background:#fff;}
  .qr i.on{background:#232831;}
  .link-field{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius-md);
    padding:9px 11px;background:var(--surface2);margin:8px 0 4px;}
  .link-field .mono{color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .field{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;}
  .field:last-child{border-bottom:none;}
  .modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .modal-actions.one{grid-template-columns:1fr;}

  .rec-line{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .rec-line:last-child{border-bottom:none;}
  .rec-line .av{width:30px;height:30px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;}
  .rec-cta{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:14px;padding:9px;border-radius:var(--radius-md);
    background:var(--primary-tint);color:var(--primary);font-weight:600;cursor:pointer;border:1px solid transparent;}
</style>
</head>
<body data-page="proposal" data-title="提案">

<main class="content">
  <div class="page-head" data-reveal>
    <div><h1>提案</h1>
      <p>渲染即报价，一键生成可分享的 H5 / PDF，客户 3D 浏览与回执自动归档。</p></div>
    <div class="spacer"></div>
    <a class="btn primary" href="editor.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex:none"><path d="M5 12h14"/><path d="M12 5v14"/></svg>＋ 新建提案</a>
  </div>

  <div class="filters" data-reveal style="animation-delay:.05s">
    <button class="fchip active" data-status="全部">全部</button>
    <button class="fchip" data-status="进行中">进行中</button>
    <button class="fchip" data-status="待打样">待打样</button>
    <button class="fchip" data-status="询价中">询价中</button>
    <button class="fchip" data-status="已完成">已完成</button>
  </div>

  <div class="table-wrap" data-reveal style="animation-delay:.1s">
    <table>
      <thead>
        <tr>
          <th>提案 / 客户</th><th>瓶型</th><th>工艺</th><th>单价</th><th>查看次数</th><th>创建时间</th><th>状态</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"><!-- JS 注入 --></tbody>
    </table>
  </div>
</main>

<!-- 分享 H5 模态 -->
<div class="modal-mask" id="shareModal">
  <div class="modal">
    <div class="card-h" style="margin-bottom:10px">
      <div><div class="card-t" style="font-size:17px">分享 H5 提案</div>
      <div class="card-sub">已生成专属 H5 落地页，客户扫码或点链接直达 3D 交互。</div></div>
      <div class="spacer" style="flex:1"></div>
      <button class="tbar-btn" data-closemodal title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex:none"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="share-box" style="align-items:flex-start">
      <div class="share-lr">
        <div class="field"><span class="muted">生成链接</span><span class="mono" id="shareLink" style="color:var(--primary)">–</span></div>
        <div class="field"><span class="muted">链接有效期</span><span class="mono" id="shareExpire">–</span></div>
        <div class="field"><span class="muted">H5 提案</span><span id="shareTitle">–</span></div>
        <div class="field"><span class="muted">客户</span><span id="shareCustomer">–</span></div>
      </div>
      <div class="share-qr">
        <div class="qr" id="qrGrid"></div>
        <span class="muted" style="font-size:11px;margin-top:6px">扫一扫 · 客户打开 3D</span>
      </div>
    </div>
    <div class="link-field"><span class="mono" id="shareLinkCopy">–</span><button class="btn sm ghost" id="copyBtn">复制链接</button></div>
    <div class="modal-actions">
      <button class="btn ghost" data-closemodal>关闭</button>
      <a class="btn ghost" id="previewBtn" href="mobile.html" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:7px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex:none"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>预览客户视角</a>
      <button class="btn primary" id="receiptBtn">查看客户打开</button>
    </div>
  </div>
</div>

<!-- 查看回执模态 -->
<div class="modal-mask" id="receiptModal">
  <div class="modal">
    <div class="card-h" style="margin-bottom:8px">
      <div><div class="card-t" style="font-size:17px" id="recTitle">客户浏览回执</div>
      <div class="card-sub">客户在 H5 中的 3D 浏览记录，自动留存。</div></div>
      <div class="spacer" style="flex:1"></div>
      <button class="tbar-btn" data-closemodal title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex:none"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="recList"><!-- JS 注入 --></div>
    <button class="rec-cta" data-closemodal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" style="flex:none"><path d="M20 6 9 17l-5-5"/></svg>已读回执，关闭</button>
  </div>
</div>

<script src="js/mock.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script>
(function(){
  var tbody=document.getElementById('tbody');
  var all=[];

  var STATUS_CLASS={'进行中':'primary','待打样':'amber','询价中':'teal','已完成':'green'};

  /* —— QR 占位：三处定位符 + 种子伪随机点 —— */
  function entropy(s){return Array.prototype.reduce.call(s,function(a,c){return (a*131+c.charCodeAt(0))%1e9;},7)||1;}
  function finder(ox,oy,x,y){
    var dx=x-ox, dy=y-oy;
    if(dx<0||dx>6||dy<0||dy>6) return -1;
    var border=(dx===0||dx===6||dy===0||dy===6);
    var center=(dx>=2&&dx<=4&&dy>=2&&dy<=4);
    return (border||center)?1:0;
  }
  function qrMarkup(seed){
    var out=[], origins=[[0,0],[14,0],[0,14]];
    for(var y=0;y<21;y++){ for(var x=0;x<21;x++){
      var v=-1;
      origins.forEach(function(o){ var f=finder(o[0],o[1],x,y); if(f>=0) v=f; });
      if(v<0) v=(entropy(seed+'@'+x+'-'+y)&1)===1?1:0;
      out.push('<i class="'+(v?'on':'')+'"></i>');
    }}
    return out.join('');
  }

  /* —— 状态徽标 —— */
  function statusBadge(s){
    var cls=STATUS_CLASS[s]||'gray';
    var tint={primary:'var(--primary)',amber:'var(--warning)',teal:'var(--accent2)',green:'var(--success)',gray:'var(--text-sub)'}[cls];
    return '<span class="tag '+cls+' status-badge"><span class="dot" style="background:'+tint+'"></span>'+s+'</span>';
  }

  /* —— 渲染行 —— */
  function renderRow(p){
    var row=document.createElement('tr');
    row.innerHTML='<td><div class="tbl-meta"><b>'+p.title+'</b><span class="cust">'+p.customer+' · '+p.id+'</span></div></td>'
      +'<td>'+p.bottle+'</td>'
      +'<td>'+p.process+'</td>'
      +'<td class="mono-price">¥'+p.price+'</td>'
      +'<td><span class="mono">'+p.views+'</span></td>'
      +'<td class="mono muted">'+p.created+'</td>'
      +'<td>'+statusBadge(p.status)+'</td>'
      +'<td><div class="row-ops">'
      +'<button class="r-op primary" data-share>分享 H5</button>'
      +'<button class="r-op" data-pdf>下载 PDF</button>'
      +'<button class="r-op" data-receipt>查看回执</button>'
      +'</div></td>';
    row.querySelector('[data-share]').addEventListener('click',function(){ share(p); });
    row.querySelector('[data-pdf]').addEventListener('click',function(){ toast('「'+p.title+'」PDF 已生成并下载'); });
    row.querySelector('[data-receipt]').addEventListener('click',function(){ openReceipt(p); });
    return row;
  }

  function render(filter){
    var list=filter==='全部' ? all : all.filter(function(p){return p.status===filter;});
    tbody.innerHTML='';
    if(!list.length){
      tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text-sub);padding:34px">暂无「'+filter+'」的提案</td></tr>';
      return;
    }
    list.forEach(function(p){ tbody.appendChild(renderRow(p)); });
  }

  /* —— 初始化加载 —— */
  tbody.innerHTML='<tr><td colspan="8" style="padding:0"><div style="display:flex;flex-direction:column;gap:12px;padding:14px">'
    +Array.apply(null,{length:3}).map(function(){return '<div style="width:100%">'+Array.apply(null,{length:8}).map(function(){return '<div class="skel" style="display:inline-block;height:14px;width:9%;margin-right:2.1%"></div>';}).join('')+'</div>';}).join('')
    +'</div></td></tr>';
  api.getProposals().then(function(r){
    all=r.data;
    render('全部');
  });

  /* —— 状态筛选 —— */
  var curFilter='全部';
  [].forEach.call(document.querySelectorAll('.fchip'),function(c){
    c.addEventListener('click',function(){
      curFilter=c.getAttribute('data-status');
      [].forEach.call(document.querySelectorAll('.fchip'),function(x){x.classList.remove('active');});
      c.classList.add('active');
      render(curFilter);
    });
  });

  /* —— 分享 H5 —— */
  var shareModal=document.getElementById('shareModal');
  function share(p){
    document.getElementById('shareTitle').textContent=p.title;
    document.getElementById('shareCustomer').textContent=p.customer;
    shareBtn.disabled=true; shareBtn.innerHTML='生成中…';
    api.draftProposal(p.id).then(function(r){
      var d=r.data;
      document.getElementById('shareLink').textContent=d.link;
      document.getElementById('shareExpire').textContent=d.expiresIn+' 天';
      document.getElementById('shareLinkCopy').textContent=d.link;
      document.getElementById('qrGrid').innerHTML=qrMarkup(d.link);
      shareBtn.disabled=false; shareBtn.innerHTML='查看客户打开';
      openModal('shareModal');
    });
  }
  var shareBtn=document.getElementById('receiptBtn');
  shareBtn.addEventListener('click',function(){
    var t=document.getElementById('shareTitle').textContent;
    var c=document.getElementById('shareCustomer').textContent;
    closeModal('shareModal');
    var cur=all.find(function(p){return p.title===t&&p.customer===c;});
    openReceipt(cur||all[0]);
  });
  document.getElementById('copyBtn').addEventListener('click',function(){
    var v=document.getElementById('shareLinkCopy').textContent;
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(function(){toast('链接已复制'); }); }
    else toast('链接已复制');
  });

  /* —— 查看回执 —— */
  var recList=document.getElementById('recList');
  var RECS=[
    {name:'Pei-pei · 采购', time:'今天 14:32', dur:'浏览 3D 38s · 停留 2min', dev:'iOS 设备'},
    {name:'Anna · 产品', time:'昨天 17:05', dur:'旋视角 8 圈 · 点击报价', dev:'Android'},
    {name:'Vivian · 老板', time:'08-24 11:18', dur:'点赞工艺· 停留 4min', dev:'微信内打开'}
  ];
  function openReceipt(p){
    document.getElementById('recTitle').textContent='浏览回执 · '+(p?p.title:'');
    recList.innerHTML=RECS.map(function(r){
      return '<div class="rec-line"><div class="av">'+(r.name.charAt(0))+ '</div><div style="flex:1"><b>'+r.name+'</b><div class="muted" style="font-size:12px">'+r.time+' · '+r.dev+'</div></div>'
        +'<div class="mono muted" style="font-size:12px;text-align:right">'+r.dur+'</div></div>';
    }).join('');
    openModal('receiptModal');
  }
})();
</script>
</body>
</html>

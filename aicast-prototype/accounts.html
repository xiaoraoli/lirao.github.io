<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵账户与环境 · AICast</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="accounts">

<main class="content">
  <div class="crumb"><a href="index.html">工作台</a><span class="sep">/</span><span>矩阵账户与环境</span></div>

  <!-- stats -->
  <div class="grid g4" style="gap:18px;margin-top:6px;">
    <div class="card rv d1"><div class="stat"><span class="s-label">接入账号</span><span class="s-value mono" id="a-total">—</span><span class="s-note">本地守护进程已注册</span></div></div>
    <div class="card rv d2"><div class="stat"><span class="s-label">健康账号</span><span class="s-value cy mono" id="a-ok">—</span><span class="s-trend up">可稳定发布</span></div></div>
    <div class="card rv d3"><div class="stat"><span class="s-label">临界 &amp; 掉线</span><span class="s-value amber mono" id="a-warn">—</span><span class="s-note">需养号 / 处置</span></div></div>
    <div class="card rv d4"><div class="stat"><span class="s-label">独立环境池</span><span class="s-value mono" id="a-env">—</span><span class="s-note">IP+指纹 独享</span></div></div>
  </div>

  <div class="toolbar block rv d2">
    <div class="seg" id="plat-filter">
      <button class="on" data-p="all">全部</button>
      <button data-p="抖音">抖音</button>
      <button data-p="快手">快手</button>
      <button data-p="小红书">小红书</button>
      <button data-p="视频号">视频号</button>
    </div>
    <div class="grow"></div>
    <button class="btn btn-ghost btn-sm" type="button" id="a-fresh">刷新健康度</button>
    <button class="btn btn-primary btn-sm" type="button" id="a-add">添加账号</button>
  </div>

  <!-- 账号网格 -->
  <div class="grid g4" id="acct-grid" style="gap:18px;margin-top:24px;"></div>

  <!-- 风险提示横幅 -->
  <div class="card rv d3" style="border-left:3px solid var(--danger);margin-top:24px;">
    <div class="row2">
      <span style="display:grid;place-items:center;color:var(--danger)">●</span>
      <div><b style="font-size:var(--t0)">禁止多平台同步发布</b><div class="small muted">抖音/快手、小红书/视频号相互封禁同步内容。强制同步的账号将被风控直接标记掉线，系统已默认拦截该操作。</div></div>
    </div>
  </div>
</main>

<!-- 账号详情 modal -->
<div class="modal-bk" id="acct-modal">
  <div class="modal">
    <div class="modal-head"><h3 id="m-name">账号详情</h3><button class="icon-btn" id="m-close" type="button">×</button></div>
    <div class="modal-body">
      <div class="row2" style="margin-bottom:14px;">
        <span class="tag outline" id="m-plat">-</span>
        <span class="tag" id="m-status">-</span>
      </div>
      <div style="margin-bottom:14px;">
        <div class="small faint" style="margin-bottom:6px">健康度</div>
        <div class="pbar g" id="m-bar"><i style="width:80%"></i></div>
        <div class="mono small faint" id="m-health" style="margin-top:5px"></div>
      </div>
      <div class="kv">
        <div class="row2"><span class="k">独立环境</span><span class="mono" id="m-env">-</span></div>
        <div class="row2"><span class="k">代理 IP</span><span class="mono" id="m-ip">-</span></div>
        <div class="row2"><span class="k">粉丝</span><span class="mono" id="m-fans">-</span></div>
      </div>
      <div style="margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--panel);font-size:var(--t-1)"><b>处置建议：</b><span id="m-advice"></span></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost btn-sm" id="m-ipswap" type="button">替换代理 IP</button>
      <button class="btn btn-danger btn-sm" id="m-forcesync" type="button">强制多平台同步</button>
      <button class="btn btn-primary btn-sm" id="m-nurse" type="button">开始养号</button>
    </div>
  </div>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="components.js"></script>
<script>
(function () {
  var list = [];
  var cur = null;
  var plat = 'all';

  function healthTag(a) {
    return a.status === 'healthy' ? '<span class="tag green">健康</span>' :
      a.status === 'critical' ? '<span class="tag amber">临界</span>' : '<span class="tag red">掉线</span>';
  }
  function barClass(a) { return a.status === 'healthy' ? 'g' : a.status === 'critical' ? 'a' : 'r'; }

  function render(grid) {
    var el = document.getElementById('acct-grid');
    el.innerHTML = grid.map(function (a, i) {
      var stText = a.status === 'healthy' ? '健康' : a.status === 'critical' ? '临界' : '掉线';
      return '<div class="card rv d' + ((i % 4) + 1) + ' acct-card" data-id="' + a.id + '">' +
        '<div class="acct-head">' +
          '<div class="avatar">' + a.short.charAt(0) + '</div>' +
          '<div class="meta"><b>' + a.name + '</b><div class="plat">' + a.platform + ' · ' + stText + '</div></div>' +
        '</div>' +
        '<div class="acct-env"><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg> ' + a.env + '</span><span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg> ' + a.ip + '</span></div>' +
        '<div class="acct-bar"><div class="pbar ' + barClass(a) + '"><i style="width:' + a.health + '%"></i></div></div>' +
        '<div class="acct-foot"><span>健康度 <b>' + a.health + '</b> / 100</span><span>粉丝 <b>' + a.fans + '</b></span></div>' +
      '</div>';
    }).join('');
    el.querySelectorAll('[data-id]').forEach(function (card) {
      card.addEventListener('click', function () {
        cur = list.find(function (x) { return x.id === card.dataset.id; });
        if (cur) openModal(cur);
      });
    });
  }

  function openModal(a) {
    document.getElementById('m-name').textContent = a.name;
    document.getElementById('m-plat').textContent = a.platform;
    var st = a.status === 'healthy' ? 'green' : a.status === 'critical' ? 'amber' : 'red';
    var stTxt = a.status === 'healthy' ? '健康' : a.status === 'critical' ? '临界' : '掉线';
    var s = document.getElementById('m-status'); s.className = 'tag ' + st; s.textContent = stTxt;
    var bar = document.getElementById('m-bar'); bar.className = 'pbar ' + (a.status === 'healthy' ? 'g' : a.status === 'critical' ? 'a' : 'r');
    bar.querySelector('i').style.width = a.health + '%';
    document.getElementById('m-health').textContent = a.health + ' / 100';
    document.getElementById('m-env').textContent = a.env;
    document.getElementById('m-ip').textContent = a.ip;
    document.getElementById('m-fans').textContent = a.fans;
    var advice = a.status === 'offline' ? '低于 20，仅可养号。再次同步发布前需处置达标，建议 3-7 天降低日更、停止跨平台、用官方原版 App 扫码互动后自动恢复。' :
      a.status === 'critical' ? '处于临界带。建议收窄发布频次、暂停跨平台同步，并做一次原版 App 扫码互动以恢复健康度。' :
      '状态良好，可正常发布。系统会在该账号触发平台检测时自动降权排后。';
    document.getElementById('m-advice').textContent = advice;
    document.getElementById('acct-modal').classList.add('open');
  }

  // 加载
  api.fetchHealthOverview().then(function (ov) {
    document.getElementById('a-total').textContent = ov.total;
    document.getElementById('a-ok').textContent = ov.healthy;
    document.getElementById('a-warn').textContent = (ov.critical + ov.offline);
    document.getElementById('a-env').textContent = ov.total;
  });
  api.fetchAccounts().then(function (a) { list = a; render(filtered()); });

  function filtered() { return plat === 'all' ? list : list.filter(function (x) { return x.platform === plat; }); }

  // 平台筛选
  var pfs = document.querySelectorAll('#plat-filter button');
  pfs.forEach(function (b) { b.onclick = function () { pfs.forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); plat = b.dataset.p; render(filtered()); }; });

  // modal 关闭
  function closeM() { document.getElementById('acct-modal').classList.remove('open'); }
  document.getElementById('m-close').onclick = closeM;
  document.getElementById('acct-modal').addEventListener('click', function (e) { if (e.target.id === 'acct-modal') closeM(); });

  // 替换 IP
  document.getElementById('m-ipswap').onclick = function () {
    if (cur) { cur.ip = '#' + (100 + Math.floor(Math.random() * 900)); render(filtered()); closeM(); window.UI.toast('已为该账号分配新独立 IP：' + cur.ip, 'ok'); }
  };
  // 强制同步 → 拦截演示
  document.getElementById('m-forcesync').onclick = function () {
    window.UI.toast('已拦截：抖音与快手禁止同步发布，该操作会导致账号掉线', 'err');
  };
  // 养号
  document.getElementById('m-nurse').onclick = function () {
    if (!cur) return;
    if (cur.status === 'healthy') { window.UI.toast('当前账号健康，无需养号', 'info'); return; }
    cur.status = 'healthy'; cur.health = 72; render(filtered()); closeM();
    window.UI.toast('已进入养号模式，处置达标后自动恢复健康', 'ok');
  };
  // 刷新 / 添加
  document.getElementById('a-fresh').onclick = function () { this.classList.add('is-loading'); setTimeout(function(){ window.UI.toast('健康度已刷新', 'ok'); }, 600); };
  document.getElementById('a-add').onclick = function () {
    // 简单模拟：新账号进入列表
    list.push({ id: 'A00' + (list.length + 1), name: '新接入探店号', platform: '抖音', short: '新店', ip: '#7' + list.length, env: 'ep-0' + (list.length + 1), health: 100, status: 'healthy', fans: '0', todayViews: '0' });
    render(filtered()); api.fetchHealthOverview().then(function (ov) { document.getElementById('a-total').textContent = ov.total + 1; document.getElementById('a-env').textContent = ov.total + 1; document.getElementById('a-ok').textContent = ov.healthy + 1; });
    window.UI.toast('已新建设备环境 ep-0' + (list.length) + '，等待扫码绑定', 'ok');
  };
})();
</script>
</body>
</html>

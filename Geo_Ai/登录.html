<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · GEO 营销闭环 SaaS</title>
  <style>
    :root{--primary:#2D6BFF;--primary-dark:#1E5AED;--bg:#F6F8FC;--line:#E2E8F0;--text:#0F172A;--gray:#64748B;--radius:14px;}
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
    body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 18px 50px rgba(15,23,42,.08);padding:40px 36px;}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:30px;}
    .brand img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
    .brand .t{font-size:20px;font-weight:800;color:var(--text);}
    .brand .sub{font-size:12.5px;color:var(--gray);margin-top:4px;}
    .fi{margin-bottom:18px;}
    .fi label{display:block;font-size:12.5px;color:var(--gray);margin-bottom:6px;font-weight:600;}
    .fi input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:14px;color:var(--text);outline:none;transition:border-color .2s;}
    .fi input:focus{border-color:var(--primary);}
    .row{display:flex;align-items:center;justify-content:space-between;margin:18px 0;font-size:12.5px;color:var(--gray);}
    .row label{display:flex;align-items:center;gap:6px;cursor:pointer;}
    .row a{color:var(--primary);text-decoration:none;}
    .btn{width:100%;height:46px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;}
    .btn:hover{background:var(--primary-dark);}
    .tip{margin-top:24px;text-align:center;font-size:12.5px;color:var(--gray);}
    .tip a{color:var(--primary);font-weight:700;text-decoration:none;}
    .law{font-size:11.5px;color:#94a3b8;text-align:center;margin-top:20px;line-height:1.6;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../assets/avatar.png" alt="logo">
      <div>
        <div class="t">云栖智家</div>
        <div class="sub">GEO 营销闭环 SaaS · Pro 版</div>
      </div>
    </div>
    <div class="fi">
      <label>邮箱 / 手机号</label>
      <input type="text" id="user" placeholder="请输入邮箱或手机号" value="market@yunqi.com">
    </div>
    <div class="fi">
      <label>密码</label>
      <input type="password" id="pwd" placeholder="请输入密码" value="******">
    </div>
    <div class="row">
      <label><input type="checkbox" checked> 记住我</label>
      <a href="#">忘记密码？</a>
    </div>
    <button class="btn" onclick="doLogin()">登录</button>
    <div class="tip">还没有账号？<a href="#">申请试用</a></div>
    <div class="law">登录即表示同意《服务条款》与《隐私政策》。本系统仅用于品牌 GEO 优化，禁止违规分发。</div>
  </div>
  <script>
    function doLogin(){
      const u=document.getElementById('user').value;
      const p=document.getElementById('pwd').value;
      if(!u||!p){alert('请输入账号和密码');return;}
      window.location.href='原型_Web控制台.html';
    }
    document.getElementById('pwd').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  </script>
</body>
</html>
